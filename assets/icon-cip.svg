<svg xmlns="http://w3.org" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="iconSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="iconGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
  </defs>

  <!-- Cadre carré arrondi -->
  <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#iconSky)" stroke="#eab308" stroke-width="6"/>

  <!-- Mer & Colline verte -->
  <path d="M 110 155 L 248 155 L 248 200 Q 248 248 200 248 L 110 248 Z" fill="#0284c7"/>
  <path d="M 8 150 Q 130 140 210 248 L 56 248 Q 8 248 8 200 Z" fill="#10b981"/>

  <!-- Pirate centré (agrandi pour la lisibilité) -->
  <g transform="translate(42, 48) scale(1.45)">
    <!-- Corps -->
    <path d="M 25 85 L 65 85 L 70 125 L 20 125 Z" fill="#dc2626"/>
    <!-- Tête -->
    <circle cx="45" cy="62" r="22" fill="#fed7aa"/>
    <!-- Bandeau œil -->
    <path d="M 24 55 L 66 52" stroke="#0f172a" stroke-width="3"/>
    <circle cx="38" cy="56" r="5.5" fill="#0f172a"/>
    <circle cx="54" cy="56" r="2.5" fill="#0f172a"/>
    <path d="M 40 70 Q 46 75 52 69" stroke="#7c2d12" stroke-width="2.5" fill="none" stroke-linecap="round"/>

    <!-- Chapeau Tricorne -->
    <path d="M 10 46 Q 45 20 80 46 Q 65 52 45 48 Q 25 52 10 46 Z" fill="#1e293b"/>
    <path d="M 22 44 Q 45 12 68 44 Z" fill="#0f172a"/>
    <circle cx="45" cy="34" r="4" fill="#eab308"/>

    <!-- Perroquet -->
    <g transform="translate(68, 56)">
      <ellipse cx="12" cy="18" rx="9" ry="14" fill="#ef4444"/>
      <path d="M 12 12 Q 22 18 14 28 Z" fill="#3b82f6"/>
      <circle cx="11" cy="6" r="7" fill="#ef4444"/>
      <circle cx="9" cy="5" r="1.5" fill="#0f172a"/>
      <path d="M 4 6 Q -2 8 4 11 Z" fill="#facc15"/>
    </g>
  </g>

  <!-- Initiales CIP dorées en bas -->
  <text x="128" y="232" text-anchor="middle" font-family="'Segoe UI', Georgia, serif" font-weight="900" font-size="30" letter-spacing="3" fill="url(#iconGold)" stroke="#090c10" stroke-width="1">
    CIP
  </text>
</svg>
