<svg xmlns="http://w3.org" viewBox="0 0 1200 350" width="1200" height="350">
  <defs>
    <!-- Dégradé Ciel -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="55%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Dégradé Mer -->
    <linearGradient id="seaGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <!-- Dégradé Vallée Verte -->
    <linearGradient id="valleyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#065f46"/>
    </linearGradient>

    <!-- Dégradé Texte Doré -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="45%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#a16207"/>
    </linearGradient>

    <!-- Ombre portée pour le titre -->
    <filter id="textShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#090c10" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- 1. CIEL & SOLEIL -->
  <rect width="1200" height="350" rx="16" fill="url(#skyGrad)"/>
  <circle cx="920" cy="85" r="42" fill="#fde047" opacity="0.9"/>
  <circle cx="920" cy="85" r="56" fill="#fde047" opacity="0.25"/>

  <!-- 2. MONTAGNES LOINTAINES (VALLÉE) -->
  <path d="M 0 210 Q 180 110 380 200 T 760 190 T 1200 170 L 1200 350 L 0 350 Z" fill="#047857" opacity="0.7"/>

  <!-- 3. MER & VAGUES (CÔTÉ DROIT) -->
  <path d="M 480 220 Q 840 205 1200 225 L 1200 350 L 450 350 Z" fill="url(#seaGrad)"/>
  <!-- Reflets vagues -->
  <path d="M 650 250 Q 680 245 710 250 M 820 275 Q 860 270 900 275 M 980 245 Q 1010 240 1040 245" 
        stroke="#bae6fd" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.6"/>

  <!-- Petit bateau pirate à l'horizon -->
  <g transform="translate(880, 198) scale(0.7)">
    <path d="M 0 25 L 55 25 L 45 40 L 10 40 Z" fill="#451a03"/>
    <line x1="28" y1="25" x2="28" y2="0" stroke="#78350f" stroke-width="3"/>
    <path d="M 30 2 L 50 15 L 30 22 Z" fill="#f8fafc"/>
  </g>

  <!-- 4. COLLINE DE LA VALLÉE (CÔTÉ GAUCHE) -->
  <path d="M 0 185 Q 260 175 490 275 Q 560 310 610 350 L 0 350 Z" fill="url(#valleyGrad)"/>
  <path d="M 0 235 Q 210 225 420 350 L 0 350 Z" fill="#059669"/>

  <!-- 5. LE PETIT PIRATE & SON PERROQUET (À GAUCHE) -->
  <g transform="translate(115, 165)">
    <!-- Corps & Manteau -->
    <path d="M 25 85 L 65 85 L 72 135 L 18 135 Z" fill="#dc2626"/>
    <rect x="22" y="112" width="46" height="8" fill="#1e293b"/>
    <rect x="40" y="110" width="10" height="12" rx="2" fill="#eab308"/>
    
    <!-- Tête -->
    <circle cx="45" cy="62" r="22" fill="#fed7aa"/>
    <!-- Bandeau œil -->
    <path d="M 24 55 L 66 52" stroke="#0f172a" stroke-width="3"/>
    <circle cx="38" cy="56" r="5.5" fill="#0f172a"/>
    <circle cx="54" cy="56" r="2.5" fill="#0f172a"/>
    <!-- Sourire -->
    <path d="M 40 70 Q 46 75 52 69" stroke="#7c2d12" stroke-width="2.5" fill="none" stroke-linecap="round"/>

    <!-- Chapeau Tricorne Pirate -->
    <path d="M 10 46 Q 45 20 80 46 Q 65 52 45 48 Q 25 52 10 46 Z" fill="#1e293b"/>
    <path d="M 22 44 Q 45 12 68 44 Z" fill="#0f172a"/>
    <!-- Emblème doré sur le chapeau -->
    <circle cx="45" cy="34" r="4" fill="#eab308"/>

    <!-- LE PERROQUET SUR L'ÉPAULE -->
    <g transform="translate(68, 56)">
      <!-- Corps rouge & aile bleue -->
      <ellipse cx="12" cy="18" rx="9" ry="14" fill="#ef4444"/>
      <path d="M 12 12 Q 22 18 14 28 Z" fill="#3b82f6"/>
      <!-- Queue -->
      <path d="M 10 30 L 6 44 L 14 32 Z" fill="#eab308"/>
      <!-- Tête & Bec -->
      <circle cx="11" cy="6" r="7" fill="#ef4444"/>
      <circle cx="9" cy="5" r="1.5" fill="#0f172a"/>
      <path d="M 4 6 Q -2 8 4 11 Z" fill="#facc15"/>
    </g>
  </g>

  <!-- 6. ÉLÉMENT INFORMATIQUE (À DROITE : TERMINAL FLOTTANT) -->
  <g transform="translate(1030, 225)">
    <rect x="0" y="0" width="110" height="75" rx="10" fill="#090c10" stroke="#00ff88" stroke-width="3"/>
    <circle cx="14" cy="12" r="3" fill="#ef4444"/>
    <circle cx="24" cy="12" r="3" fill="#eab308"/>
    <circle cx="34" cy="12" r="3" fill="#00ff88"/>
    <text x="15" y="45" fill="#00ff88" font-family="monospace" font-weight="bold" font-size="18">&gt;_ CIP</text>
    <line x1="15" y1="56" x2="75" y2="56" stroke="#334155" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- 7. GRAND TITRE DORÉ CENTRAL -->
  <g filter="url(#textShadow)" text-anchor="middle">
    <text x="615" y="115" font-family="'Segoe UI', Georgia, serif" font-weight="900" font-size="38" letter-spacing="1.5" fill="url(#goldGrad)">
      COMMUNAUTÉ INFORMATIQUE
    </text>
    <text x="615" y="172" font-family="'Segoe UI', Georgia, serif" font-weight="900" font-size="56" letter-spacing="4" fill="url(#goldGrad)">
      PYRATE
    </text>
  </g>
</svg>
